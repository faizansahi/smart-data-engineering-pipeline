[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="smart-weather-pipeline"
version="0.1.0"
requires-python=">=3.12"
dependencies=["pandas>=2.2,<3","requests>=2.32,<3","sqlalchemy>=2,<3","psycopg[binary]>=3.2,<4","pydantic>=2.9,<3","tenacity>=9,<10"]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-cov>=5,<7","ruff>=0.8,<1"]
airflow=["apache-airflow>=2.10,<3"]
[tool.hatch.build.targets.wheel]
packages=["src/weather_pipeline"]
[tool.pytest.ini_options]
pythonpath=["src"]
[tool.ruff]
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]
ignore=["E501"]
