name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,demo]"
      - run: python -m pip check
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=weather_pipeline --cov-report=term-missing
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate an ephemeral database password
        shell: bash
        run: |
          portfolio_password="$(openssl rand -hex 24)"
          echo "::add-mask::$portfolio_password"
          echo "POSTGRES_PASSWORD=$portfolio_password" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait db
      - name: PostgreSQL ETL and analytics integration
        run: docker compose run --rm -T pipeline python scripts/verify_container.py > docs/results/docker-demo.json
      - name: Airflow image and DAG import
        run: |
          docker build -f Dockerfile.airflow -t portfolio-airflow .
          docker run --rm -v "$PWD/dags:/opt/airflow/dags:ro" --entrypoint python portfolio-airflow -c "from airflow.models import DagBag; bag=DagBag('/opt/airflow/dags', include_examples=False); assert not bag.import_errors, bag.import_errors; assert 'open_meteo_weather' in bag.dags; print('Airflow DAG imported successfully')"
      - uses: actions/upload-artifact@v4
        with:
          name: container-evidence
          path: |
            docs/results/docker-demo.json
          if-no-files-found: error
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop isolated CI services
        if: always()
        run: docker compose down -v
